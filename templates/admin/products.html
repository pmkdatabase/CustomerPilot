{% extends "base.html" %}
{% block title %}— Products{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4">Products</h4>

<div class="row g-4">
  <div class="col-md-4">
    <div class="card p-4">
      <h6 class="fw-bold mb-3">Add Product</h6>
      <form method="POST">
        <div class="mb-2">
          <input type="text" name="name" class="form-control form-control-sm" placeholder="Product name" required>
        </div>
        <div class="mb-2">
          <input type="text" name="sku" class="form-control form-control-sm" placeholder="SKU" required>
        </div>
        <div class="mb-3">
          <textarea name="description" class="form-control form-control-sm" rows="2" placeholder="Description (optional)"></textarea>
        </div>
        <button class="btn btn-sm btn-primary">Add Product</button>
      </form>
    </div>
  </div>

  <div class="col-md-8">
    <div class="card p-4">
      <table class="table table-sm table-hover">
        <thead class="table-light">
          <tr><th>Name</th><th>SKU</th><th>Description</th></tr>
        </thead>
        <tbody>
          {% for p in products %}
          <tr>
            <td>{{ p.name }}</td>
            <td class="text-muted">{{ p.sku }}</td>
            <td class="text-muted small">{{ p.description or '—' }}</td>
          </tr>
          {% else %}
          <tr><td colspan="3" class="text-muted">No products yet.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
